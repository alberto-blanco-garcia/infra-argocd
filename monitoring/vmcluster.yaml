apiVersion: operator.victoriametrics.com/v1beta1
kind: VMCluster
metadata:
  name: vm
  namespace: monitoring
spec:
  retentionPeriod: "1"

  vmstorage:
    replicaCount: 1
    nodeSelector:
      node.longhorn.io/ready: "true"
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: longhorn
          resources:
            requests:
              storage: "16Gi"

  vmselect:
    replicaCount: 1
    nodeSelector:
      node.longhorn.io/ready: "true"
    cacheMountPath: /select-cache
    storage:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: longhorn
          resources:
            requests:
              storage: "8Gi"

  vminsert:
    replicaCount: 1
    nodeSelector:
      node.longhorn.io/ready: "true"
