apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.11.1

    helm:
      values: |
        preUpgradeChecker:
          jobEnabled: false
        preDeleteChecker:
          jobEnabled: false
        upgradeChecker:
          jobEnabled: false

        
        defaultSettings:
          defaultDataPath: /mnt/longhorn

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - Force=true
      - Validate=false
      - ApplyOutOfSyncOnly=true
